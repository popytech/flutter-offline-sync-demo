name: flutter_offline_sync_demo
description: Offline-first Flutter reference with SQLite outbox synchronization.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.1.4
  file_picker: ^8.1.7
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
